name: Update HSR RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Hoyolab RSS Feeds
        run: python -m pip install hoyolab-rss-feeds

      - name: Generate RSS
        run: python -m hoyolabrssfeeds -c config.toml

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starrail.xml
          git diff --cached --quiet || git commit -m "Update HSR RSS feed"
          git push
